<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Fundo Sofisticado -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a1d28" />
      <stop offset="100%" stop-color="#2a0f16" />
    </radialGradient>
    
    <!-- Degradê Rosa Gold -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbe5e9" />
      <stop offset="50%" stop-color="#e1758f" />
      <stop offset="100%" stop-color="#d15372" />
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)" />

  <!-- Moldura Geométrica Fina -->
  <circle cx="250" cy="220" r="140" fill="none" stroke="url(#roseGold)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="250" cy="220" r="130" fill="none" stroke="url(#roseGold)" stroke-width="2" />

  <!-- Símbolo Minimalista: Monograma V + Traço Curvo Cílios/Sobrancelha -->
  <g transform="translate(0, -10)">
    <!-- Sobrancelha/Cílio estilizado -->
    <path d="M 170 180 Q 250 120 330 180 Q 250 155 170 180 Z" fill="url(#roseGold)" />
    
    <!-- Letra V Elegante Integrada -->
    <path d="M 210 185 L 250 275 L 290 185" fill="none" stroke="url(#roseGold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Detalhe de Brilho / Cílio Central -->
    <circle cx="250" cy="142" r="4" fill="#fbe5e9" />
  </g>

  <!-- Tipografia -->
  <text x="250" y="380" text-anchor="middle" font-family="'Playfair Display', 'Georgia', serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="4">
    VALIATTI
  </text>
  
  <text x="250" y="410" text-anchor="middle" font-family="'Montserrat', 'sans-serif'" font-size="14" font-weight="300" fill="#e1758f" letter-spacing="8">
    STUDIO LASH &amp; BROW
  </text>
</svg>
